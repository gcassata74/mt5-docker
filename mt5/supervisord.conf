[supervisord]
nodaemon=true
environment=WINEDLLOVERRIDES="mscoree,mshtml="

[program:mt5]
command=/run_mt5.sh
environment=DISPLAY=":0",WINEPREFIX="/config/.wine",WINEDEBUG="-all",WINEDLLOVERRIDES="mscoree,mshtml="
autorestart=true
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
